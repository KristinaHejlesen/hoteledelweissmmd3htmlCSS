<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Edeleweiss</title>
    <link rel="stylesheet" href="./assets/CSS/style.css">
    <script src="./assets/JS/app.js"defer></script>
    <!--fontawesom iconer-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <nav>
            <a href="#"><img src="./assets/img/logoHoteledelweiss.svg" alt=""></a>
            <div class="globalNav">
                
                <div class="navcontainer">
                    <ul>
                        <li>
                            <a href="#" id="forside">Forside</a>
                        </li>
                        <li>
                            <div class="dropdown">
                                <button class="dropbtn">Området<i class="fa-solid fa-chevron-down"></i></button>
                                <div class="dropdownIndhold dropdownLinks">
                                    <a href="#">Sommer</a>
                                    <a href="#">Vinter</a>
                                </div>
                            </div>
                        </li>
                        <li>
                            <a href="#">Værelser</a>
                        </li>
                        <li>
                            <div class="dropdown">
                                <button class="dropbtn">Hoteloversigt<i class="fa-solid fa-chevron-down"></i></button>
                                <div class="dropdownIndhold dropdownLinks">
                                    <a href="#">Restaurant</a>
                                    <a href="#">Faciliteter</a>
                                </div>
                            </div>
                        </li>
                        <li>
                            <a href="#">Værd at vide</a>
                        </li>
                        <li>
                            <a href="#">Hjertet bag</a>
                        </li>
                        
                    </ul>
                    
                </div>    
            </div>
            <div class="btn_book_container">
                <button class="btn_book">Book ophold</button>

            </div>
            <button id="menu"><i class="fa-solid fa-bars"></i></button>

    </header>
    <main>
        <div class="heroimage">
            <!--spille automatisk, muted skal være på for at browser tillader det, playinline sikre at den ikke afpiller på hele iphone skærme, mne bliver i sitet, loop = starter forfra-->
            <video autoplay muted playinline loop>
                <source src="./assets/img/Edelweiss_hero.mp4" type="video/mp4">
            </video>
        </div>
        <section>
        <h1>Hotel Edelweiss</h1>
        </section>
